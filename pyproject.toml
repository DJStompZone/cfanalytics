[project]
name = "cfanalytics"
version = "0.2.3"
description = "Set of tools for Cloudflare analytics data retrieval, storage, aggregation, and analysis"
authors = [
    {name = "DJ Stomp",email = "85457381+DJStompZone@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "duckdb (>=1.5.6,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "streamlit (>=1.65.0,<2.0.0)"
]

[project.scripts]
cfanalytics = "cfanalytics.cli:main"
cfanalytics-aggregate = "cfanalytics.cli:aggregate_main"
cfanalytics-dashboard = "cfanalytics.dashboard_cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
